version: "3.9"

services:
  # Første SearchAPI
  searchapi-1:
    build:
      context: .
      dockerfile: SearchAPI/Dockerfile
    image: searchengine-searchapi:latest
    container_name: searchapi-1
    environment:
      - ASPNETCORE_URLS=http://+:8080
      # Dansk kommentar: Brug kun shards, ikke den almindelige DB-fil
      - SEARCH_SQLITE_SHARDS=/data/oleDB_shard1.db,/data/oleDB_shard2.db
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - SERVICE_NAME=searchapi-1
    expose:
      - "8080"
    ports:
      - "5001:8080"
    volumes:
      # Dansk kommentar: Mount din mappe med shard-filer
      - "C:\\Users\\cbjoe\\OneDrive\\Desktop\\skole\\oleCaseDB:/data"
    networks:
      - se-net

  # Anden SearchAPI
  searchapi-2:
    build:
      context: .
      dockerfile: SearchAPI/Dockerfile
    image: searchengine-searchapi:latest
    container_name: searchapi-2
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - SEARCH_SQLITE_SHARDS=/data/oleDB_shard1.db,/data/oleDB_shard2.db
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - SERVICE_NAME=searchapi-2
    expose:
      - "8080"
    ports:
      - "5002:8080"
    volumes:
      - "C:\\Users\\cbjoe\\OneDrive\\Desktop\\skole\\oleCaseDB:/data"
    networks:
      - se-net

  # Load balancer
  loadbalancer:
    build:
      context: .
      dockerfile: Loadbalencer/Dockerfile
    image: searchengine-loadbalancer:latest
    container_name: loadbalancer
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - BACKENDS=http://searchapi-1:8080,http://searchapi-2:8080
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - SERVICE_NAME=loadbalancer
    ports:
      - "5000:8080"
    depends_on:
      - searchapi-1
      - searchapi-2
    networks:
      - se-net

  # Web front-end
  searchweb:
    build:
      context: .
      dockerfile: SearchWeb/Dockerfile
    image: searchengine-searchweb:latest
    container_name: searchweb
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - SearchApi__BaseUrl=http://loadbalancer:8080
      - LOKI_URL=http://loki:3100/loki/api/v1/push
      - SERVICE_NAME=searchweb
    ports:
      - "5068:8080"
    depends_on:
      - loadbalancer
    networks:
      - se-net

  # Loki (logs) and Grafana (visualize)
  loki:
    image: grafana/loki:2.8.2
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - se-net

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - loki
    networks:
      - se-net


networks:
  se-net:
    driver: bridge
