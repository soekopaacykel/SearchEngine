# Simple SearchEngine deployment for Minikube with monolithic database
---
apiVersion: v1
kind: Namespace
metadata:
  name: searchengine-mono
---
# ConfigMap for database initialization script
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: searchengine-mono
data:
  init-db.sql: |
    CREATE DATABASE search;
    \c search;
    CREATE TABLE word(id INTEGER PRIMARY KEY, name TEXT UNIQUE);
    CREATE INDEX word_name_index ON word (name);
    CREATE TABLE document(id INTEGER PRIMARY KEY, url TEXT, idxTime TEXT, creationTime TEXT);
    CREATE INDEX document_url_index ON document (url);
    CREATE TABLE occ(wordId INTEGER, docId INTEGER);
    CREATE INDEX word_index ON occ (wordId);
    CREATE INDEX doc_index ON occ (docId);
---
# PostgreSQL Persistent Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: searchengine-mono
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/postgres
---
# PostgreSQL Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: searchengine-mono
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: manual
---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: searchengine-mono
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "search"
        - name: POSTGRES_USER
          value: "ameliavalentin"
        - name: POSTGRES_PASSWORD
          value: "DBkonger1234"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-script
        configMap:
          name: postgres-init-script
          items:
          - key: init-db.sql
            path: init-db.sql
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: searchengine-mono
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
# SearchAPI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchapi
  namespace: searchengine-mono
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchapi
  template:
    metadata:
      labels:
        app: searchapi
    spec:
      containers:
      - name: searchapi
        image: cbjoedstrup/searchapi:1.1.9
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
---
# SearchAPI Service
apiVersion: v1
kind: Service
metadata:
  name: searchapi
  namespace: searchengine-mono
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
spec:
  selector:
    app: searchapi
  ports:
  - name: http
    port: 5154
    targetPort: 8080
---
# SearchWeb Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchweb
  namespace: searchengine-mono
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchweb
  template:
    metadata:
      labels:
        app: searchweb
    spec:
      containers:
      - name: searchweb
        image: cbjoedstrup/searchweb:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: SearchApi__BaseUrl
          value: "http://searchapi:5154"
---
# SearchWeb Service
apiVersion: v1
kind: Service
metadata:
  name: searchweb
  namespace: searchengine-mono
spec:
  selector:
    app: searchweb
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30081
  type: NodePort
---
# Indexer Job (runs once to populate database)
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-job
  namespace: searchengine-mono
spec:
  template:
    metadata:
      labels:
        app: indexer
    spec:
      restartPolicy: OnFailure
      containers:
      - name: indexer
        image: soekopaacykel/indexer:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DOTNET_ENVIRONMENT
          value: "Production"
        - name: INDEX_PATH
          value: "/app/data"
        - name: DATABASE_TYPE
          value: "mono"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        command: ["/bin/sh"]
        args: 
          - -c
          - |
            # Run the indexer on the mounted real data
            dotnet indexer.dll
      volumes:
      - name: data-volume
        hostPath:
          path: /data/medium
          type: Directory
      # This job will run after database is ready
      initContainers:
      - name: wait-for-postgres
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres -p 5432 -U ameliavalentin; do echo waiting for postgres; sleep 2; done;']
---
# ServiceMonitor for Prometheus Operator (kube-prometheus-stack)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: searchapi-servicemonitor-mono
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: searchapi
  namespaceSelector:
    matchNames:
      - searchengine-mono
  endpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: 15s
      scrapeTimeout: 10s
---
# Grafana datasource for Prometheus (kube-prometheus-stack)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-prometheus
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      isDefault: true
      url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
      editable: true
---
# Minimal ASP.NET Core dashboard example (works with Prometheus Operator labels)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-searchapi-mono
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  searchapi-dashboard.json: |
    {
      "__inputs": [],
      "__requires": [
        { "type": "grafana", "id": "grafana", "name": "Grafana", "version": "10.0.0" },
        { "type": "panel", "id": "timeseries", "name": "Time series", "version": "10.0.0" },
        { "type": "datasource", "id": "prometheus", "name": "Prometheus", "version": "1.0.0" }
      ],
      "title": "SearchAPI(mono) - Health, Scrape & Latency",
      "uid": "searchapi-health-mono",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "10s",
      "panels": [
        {
          "type": "stat",
          "title": "SearchAPI Up",
          "id": 1,
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "max(up{namespace=\"searchengine-mono\", service=\"searchapi\"})",
              "legendFormat": "up",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Scrape duration (searchapi)",
          "id": 2,
          "gridPos": { "h": 8, "w": 12, "x": 8, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "avg(scrape_duration_seconds{job=~\".*searchapi.*\"})",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Samples scraped (searchapi)",
          "id": 3,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "avg(scrape_samples_post_metric_relabeling{job=~\".*searchapi.*\"})",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Latency p50/p95/p99 (ms)",
          "id": 10,
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.50, sum by (le) (rate(search_latency_ms_milliseconds_bucket[5m])))", "legendFormat": "p50" },
            { "refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(search_latency_ms_milliseconds_bucket[5m])))", "legendFormat": "p95" },
            { "refId": "C", "expr": "histogram_quantile(0.99, sum by (le) (rate(search_latency_ms_milliseconds_bucket[5m])))", "legendFormat": "p99" }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "table",
          "title": "Recent searches (~last 100)",
          "id": 14,
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 41 },
          "options": { "showHeader": true },
          "targets": [
            {
              "refId": "A",
              "expr": "{__name__=~\"search_recent_ms_.*_milliseconds\"}",
              "legendFormat": "{{__name__}}"
            }
          ],
          "transformations": [
            { "id": "reduce", "options": { "reducers": ["lastNotNull"], "includeTimeField": false } },
            { "id": "labelsToFields", "options": { "mode": "columns" } }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "table",
          "title": "Top users by p95 latency (last 15m)",
          "id": 11,
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 23 },
          "options": { "showHeader": true },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, histogram_quantile(0.95, sum by (user_id, le) (rate(search_latency_ms_milliseconds_bucket[5m]))))",
              "legendFormat": "{{user_id}}"
            }
          ],
          "transformations": [ { "id": "labelsToFields", "options": { "mode": "columns" } } ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Requests per second",
          "id": 12,
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 23 },
          "fieldConfig": { "defaults": { "unit": "req/s" } },
          "targets": [
            { "refId": "A", "expr": "sum(rate(search_requests_total_count_total[5m])) or vector(0)", "legendFormat": "rps" }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Error rate",
          "id": 13,
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 33 },
          "fieldConfig": { "defaults": { "unit": "req/s" } },
          "targets": [
            { "refId": "A", "expr": "sum(rate(search_errors_total_count_total[5m])) or vector(0)", "legendFormat": "errors/s" }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        }
      ]
    }
---
# (Removed separate latency dashboard; merged into grafana-dashboard-searchapi above)