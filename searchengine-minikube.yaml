# Simple SearchEngine deployment for Minikube
---
apiVersion: v1
kind: Namespace
metadata:
  name: searchengine
---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: searchengine
  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "search"
        - name: POSTGRES_USER
          value: "ameliavalentin"
        - name: POSTGRES_PASSWORD
          value: "DBkonger1234"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        emptyDir: {}
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: searchengine
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
# SearchAPI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchapi
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchapi
  template:
    metadata:
      labels:
        app: searchapi
    spec:
      containers:
      - name: searchapi
        image: searchapi:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
---
# SearchAPI Service
apiVersion: v1
kind: Service
metadata:
  name: searchapi
  namespace: searchengine
spec:
  selector:
    app: searchapi
  ports:
  - name: http
    port: 5154
    targetPort: 8080
---
# SearchWeb Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchweb
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchweb
  template:
    metadata:
      labels:
        app: searchweb
    spec:
      containers:
      - name: searchweb
        image: searchweb:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: SearchApi__BaseUrl
          value: "http://searchapi:5154"
---
# SearchWeb Service
apiVersion: v1
kind: Service
metadata:
  name: searchweb
  namespace: searchengine
spec:
  selector:
    app: searchweb
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
  type: NodePort