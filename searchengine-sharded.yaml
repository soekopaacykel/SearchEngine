# SearchEngine deployment with Sharded PostgreSQL for Minikube
---
apiVersion: v1
kind: Namespace
metadata:
  name: searchengine
---
# ConfigMap for database initialization scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: searchengine
data:
  init-words.sql: |
    CREATE DATABASE search_words;
    \c search_words;
    CREATE TABLE word(id INTEGER PRIMARY KEY, name TEXT UNIQUE);
    CREATE INDEX word_name_index ON word (name);
    
  init-documents.sql: |
    CREATE DATABASE search_documents;
    \c search_documents;
    CREATE TABLE document(id INTEGER PRIMARY KEY, url TEXT, idxTime TEXT, creationTime TEXT);
    CREATE INDEX document_url_index ON document (url);
    
  init-occurrences.sql: |
    CREATE DATABASE search_occurrences;
    \c search_occurrences;
    CREATE TABLE occ(wordId INTEGER, docId INTEGER);
    CREATE INDEX word_index ON occ (wordId);
    CREATE INDEX doc_index ON occ (docId);
---
# PostgreSQL Words Persistent Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-words-pv
  namespace: searchengine
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/postgres-words
---
# PostgreSQL Words Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-words-pvc
  namespace: searchengine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: manual
---
# PostgreSQL Documents Persistent Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-documents-pv
  namespace: searchengine
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/postgres-documents
---
# PostgreSQL Documents Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-documents-pvc
  namespace: searchengine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: manual
---
# PostgreSQL Occurrences Persistent Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-occurrences-pv
  namespace: searchengine
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/postgres-occurrences
---
# PostgreSQL Occurrences Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-occurrences-pvc
  namespace: searchengine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: manual
---
# PostgreSQL Words Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-words
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-words
  template:
    metadata:
      labels:
        app: postgres-words
        shard: words
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "search_words"
        - name: POSTGRES_USER
          value: "ameliavalentin"
        - name: POSTGRES_PASSWORD
          value: "DBkonger1234"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_words
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_words
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-words-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          items:
          - key: init-words.sql
            path: init-words.sql
---
# PostgreSQL Words Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-words
  namespace: searchengine
spec:
  selector:
    app: postgres-words
  ports:
  - port: 5432
    targetPort: 5432
---
# PostgreSQL Documents Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-documents
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-documents
  template:
    metadata:
      labels:
        app: postgres-documents
        shard: documents
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "search_documents"
        - name: POSTGRES_USER
          value: "ameliavalentin"
        - name: POSTGRES_PASSWORD
          value: "DBkonger1234"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_documents
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_documents
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-documents-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          items:
          - key: init-documents.sql
            path: init-documents.sql
---
# PostgreSQL Documents Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-documents
  namespace: searchengine
spec:
  selector:
    app: postgres-documents
  ports:
  - port: 5432
    targetPort: 5432
---
# PostgreSQL Occurrences Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-occurrences
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-occurrences
  template:
    metadata:
      labels:
        app: postgres-occurrences
        shard: occurrences
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "search_occurrences"
        - name: POSTGRES_USER
          value: "ameliavalentin"
        - name: POSTGRES_PASSWORD
          value: "DBkonger1234"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_occurrences
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_occurrences
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-occurrences-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          items:
          - key: init-occurrences.sql
            path: init-occurrences.sql
---
# PostgreSQL Occurrences Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-occurrences
  namespace: searchengine
spec:
  selector:
    app: postgres-occurrences
  ports:
  - port: 5432
    targetPort: 5432
---
# SearchAPI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchapi
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchapi
  template:
    metadata:
      labels:
        app: searchapi
    spec:
      containers:
      - name: searchapi
        image: cbjoedstrup/searchapi:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
---
# SearchAPI Service
apiVersion: v1
kind: Service
metadata:
  name: searchapi
  namespace: searchengine
  labels:
    app: searchapi
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
spec:
  selector:
    app: searchapi
  ports:
  - name: http
    port: 5154
    targetPort: 8080
---
# SearchWeb Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchweb
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchweb
  template:
    metadata:
      labels:
        app: searchweb
    spec:
      containers:
      - name: searchweb
        image: cbjoedstrup/searchweb:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: SearchApi__BaseUrl
          value: "http://searchapi:5154"
---
# SearchWeb Service
apiVersion: v1
kind: Service
metadata:
  name: searchweb
  namespace: searchengine
spec:
  selector:
    app: searchweb
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
  type: NodePort
---
# Indexer Job (runs once to populate databases)
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-job
  namespace: searchengine
spec:
  template:
    metadata:
      labels:
        app: indexer
    spec:
      restartPolicy: OnFailure
      containers:
      - name: indexer
        image: cbjoedstrup/indexer:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DOTNET_ENVIRONMENT
          value: "Production"
        - name: INDEX_PATH
          value: "/app/data"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        command: ["/bin/sh"]
        args: 
          - -c
          - |
            # Run the indexer on the mounted real data
            dotnet indexer.dll
      volumes:
      - name: data-volume
        hostPath:
          path: /data/medium
          type: Directory
      # This job will run after databases are ready
      initContainers:
      - name: wait-for-postgres-words
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-words -p 5432 -U ameliavalentin; do echo waiting for postgres-words; sleep 2; done;']
      - name: wait-for-postgres-documents
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-documents -p 5432 -U ameliavalentin; do echo waiting for postgres-documents; sleep 2; done;']
      - name: wait-for-postgres-occurrences
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-occurrences -p 5432 -U ameliavalentin; do echo waiting for postgres-occurrences; sleep 2; done;']
---
# ServiceMonitor for Prometheus Operator (kube-prometheus-stack)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: searchapi-servicemonitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: searchapi
  namespaceSelector:
    matchNames:
      - searchengine
  endpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: 15s
      scrapeTimeout: 10s
---
# Grafana datasource for Prometheus (kube-prometheus-stack)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-prometheus
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      isDefault: true
      url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
      editable: true
---
# Minimal ASP.NET Core dashboard example (works with Prometheus Operator labels)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-searchapi
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  searchapi-dashboard.json: |
    {
      "__inputs": [],
      "__requires": [
        { "type": "grafana", "id": "grafana", "name": "Grafana", "version": "10.0.0" },
        { "type": "panel", "id": "timeseries", "name": "Time series", "version": "10.0.0" },
        { "type": "datasource", "id": "prometheus", "name": "Prometheus", "version": "1.0.0" }
      ],
      "title": "SearchAPI - Health & Scrape",
      "uid": "searchapi-health",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "type": "stat",
          "title": "SearchAPI Up",
          "id": 1,
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "max(up{namespace=\"searchengine\", service=\"searchapi\"})",
              "legendFormat": "up",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Scrape duration (searchapi)",
          "id": 2,
          "gridPos": { "h": 8, "w": 12, "x": 8, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "avg(scrape_duration_seconds{job=~\".*searchapi.*\"})",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Samples scraped (searchapi)",
          "id": 3,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "avg(scrape_samples_post_metric_relabeling{job=~\".*searchapi.*\"})",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        }
      ]
    }