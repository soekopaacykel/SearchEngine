---
# SearchAPI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchapi
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchapi
  template:
    metadata:
      labels:
        app: searchapi
    spec:
      containers:
      - name: searchapi
        image: searchapi:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
---
# SearchAPI Service
apiVersion: v1
kind: Service
metadata:
  name: searchapi
  namespace: searchengine
spec:
  selector:
    app: searchapi
  ports:
  - port: 5154
    targetPort: 8080
---
# SearchWeb Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchweb
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchweb
  template:
    metadata:
      labels:
        app: searchweb
    spec:
      containers:
      - name: searchweb
        image: searchweb:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: SearchApi__BaseUrl
          value: "http://searchapi:5154"
---
# SearchWeb Service
apiVersion: v1
kind: Service
metadata:
  name: searchweb
  namespace: searchengine
spec:
  selector:
    app: searchweb
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
  type: NodePort
---
# Indexer Job (runs once to populate databases)
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-job
  namespace: searchengine
spec:
  template:
    metadata:
      labels:
        app: indexer
    spec:
      restartPolicy: OnFailure
      containers:
      - name: indexer
        image: indexer:latest
        imagePullPolicy: Never
        env:
        - name: DOTNET_ENVIRONMENT
          value: "Production"
        - name: INDEX_PATH
          value: "/app/data"
        command: ["/bin/sh"]
        args: 
          - -c
          - |
            # Create test data directory and some sample files
            mkdir -p /app/data
            echo "This is a sample document about search engines and databases." > /app/data/doc1.txt
            echo "Databases are essential for storing and retrieving information efficiently." > /app/data/doc2.txt
            echo "Search engines use advanced algorithms to index and search through documents." > /app/data/doc3.txt
            echo "Kubernetes provides container orchestration for scalable applications." > /app/data/doc4.txt
            echo "PostgreSQL is a powerful relational database management system." > /app/data/doc5.txt
            
            # Run the indexer
            dotnet indexer.dll
      # This job will run after databases are ready
      initContainers:
      - name: wait-for-postgres-words
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-words -p 5432 -U ameliavalentin; do echo waiting for postgres-words; sleep 2; done;']
      - name: wait-for-postgres-documents
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-documents -p 5432 -U ameliavalentin; do echo waiting for postgres-documents; sleep 2; done;']
      - name: wait-for-postgres-occurrences
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-occurrences -p 5432 -U ameliavalentin; do echo waiting for postgres-occurrences; sleep 2; done;']