# SearchEngine deployment with Sharded PostgreSQL for Minikube
---
apiVersion: v1
kind: Namespace
metadata:
  name: searchengine
---
# ConfigMap for database initialization scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: searchengine
data:
  init-words.sql: |
    SELECT 'CREATE DATABASE search_words' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'search_words')\gexec
    \c search_words;
    CREATE TABLE IF NOT EXISTS word(id INTEGER PRIMARY KEY, name TEXT UNIQUE);
    CREATE INDEX IF NOT EXISTS word_name_index ON word (name);
    
  init-documents.sql: |
    SELECT 'CREATE DATABASE search_documents' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'search_documents')\gexec
    \c search_documents;
    CREATE TABLE IF NOT EXISTS document(id INTEGER PRIMARY KEY, url TEXT, idxTime TEXT, creationTime TEXT);
    CREATE INDEX IF NOT EXISTS document_url_index ON document (url);
    
  init-occurrences.sql: |
    SELECT 'CREATE DATABASE search_occurrences' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'search_occurrences')\gexec
    \c search_occurrences;
    CREATE TABLE IF NOT EXISTS occ(wordId INTEGER, docId INTEGER);
    CREATE INDEX IF NOT EXISTS word_index ON occ (wordId);
    CREATE INDEX IF NOT EXISTS doc_index ON occ (docId);
---
# PostgreSQL Words Persistent Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-words-pv
  namespace: searchengine
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/postgres-words
---
# PostgreSQL Words Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-words-pvc
  namespace: searchengine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: manual
---
# PostgreSQL Documents Persistent Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-documents-pv
  namespace: searchengine
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/postgres-documents
---
# PostgreSQL Documents Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-documents-pvc
  namespace: searchengine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: manual
---
# PostgreSQL Occurrences Persistent Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-occurrences-pv
  namespace: searchengine
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/postgres-occurrences
---
# PostgreSQL Occurrences Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-occurrences-pvc
  namespace: searchengine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: manual
---
# PostgreSQL Words Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-words
  namespace: searchengine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgres-words
  template:
    metadata:
      labels:
        app: postgres-words
        shard: words
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "search_words"
        - name: POSTGRES_USER
          value: "ameliavalentin"
        - name: POSTGRES_PASSWORD
          value: "DBkonger1234"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_words
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_words
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-words-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          items:
          - key: init-words.sql
            path: init-words.sql
---
# PostgreSQL Words Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-words
  namespace: searchengine
spec:
  selector:
    app: postgres-words
  ports:
  - port: 5432
    targetPort: 5432
---
# PostgreSQL Documents Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-documents
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-documents
  template:
    metadata:
      labels:
        app: postgres-documents
        shard: documents
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "search_documents"
        - name: POSTGRES_USER
          value: "ameliavalentin"
        - name: POSTGRES_PASSWORD
          value: "DBkonger1234"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_documents
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_documents
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-documents-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          items:
          - key: init-documents.sql
            path: init-documents.sql
---
# PostgreSQL Documents Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-documents
  namespace: searchengine
spec:
  selector:
    app: postgres-documents
  ports:
  - port: 5432
    targetPort: 5432
---
# PostgreSQL Occurrences Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-occurrences
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-occurrences
  template:
    metadata:
      labels:
        app: postgres-occurrences
        shard: occurrences
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "search_occurrences"
        - name: POSTGRES_USER
          value: "ameliavalentin"
        - name: POSTGRES_PASSWORD
          value: "DBkonger1234"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_occurrences
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_occurrences
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-occurrences-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          items:
          - key: init-occurrences.sql
            path: init-occurrences.sql
---
# PostgreSQL Occurrences Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-occurrences
  namespace: searchengine
spec:
  selector:
    app: postgres-occurrences
  ports:
  - port: 5432
    targetPort: 5432
---
# SearchAPI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchapi
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchapi
  template:
    metadata:
      labels:
        app: searchapi
    spec:
      containers:
      - name: searchapi
        # Original image: cbjoedstrup/searchapi:1.1.9 
        # Updated image: cbjoedstrup/searchapi:1.2.0 should work for ARM64
        image: cbjoedstrup/searchapi:1.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        # Ensure the API runs in sharded DB mode and labels metrics accordingly
        - name: DATABASE_MODE
          value: "y-sharded"
        - name: SHARDS_X
          value: "1"
        - name: SHARDS_Y
          value: "3"
        - name: METRICS_USER_LABEL
          value: "true"
---
# SearchAPI Service
apiVersion: v1
kind: Service
metadata:
  name: searchapi
  namespace: searchengine
  labels:
    app: searchapi
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
spec:
  selector:
    app: searchapi
  ports:
  - name: http
    port: 5154
    targetPort: 8080
---
# SearchWeb Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchweb
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searchweb
  template:
    metadata:
      labels:
        app: searchweb
    spec:
      containers:
      - name: searchweb
        image: soekopaacykel/searchweb:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: SearchApi__BaseUrl
          value: "http://searchapi:5154"
---
# SearchWeb Service
apiVersion: v1
kind: Service
metadata:
  name: searchweb
  namespace: searchengine
spec:
  selector:
    app: searchweb
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
  type: NodePort
---
# Indexer Job (runs once to populate databases)
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-job
  namespace: searchengine
spec:
  template:
    metadata:
      labels:
        app: indexer
    spec:
      restartPolicy: OnFailure
      containers:
      - name: indexer
        image: soekopaacykel/indexer:latest
        imagePullPolicy: Always
        env:
        - name: DOTNET_ENVIRONMENT
          value: "Production"
        # Use the mounted path directly so the indexer can see your files
        - name: INDEX_PATH
          value: "/data/medium"
        # Explicitly select sharded mode inside Kubernetes
        - name: DATABASE_TYPE
          value: "sharded"
        # Provide namespace for auto-detection/logging (Downward API)
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: data-volume
          mountPath: /data/medium
        command: ["/bin/sh"]
        args: 
          - -c
          - |
            # Run the indexer on the mounted real data
            dotnet indexer.dll
      volumes:
      - name: data-volume
        hostPath:
          path: /data/medium
          type: Directory
      # This job will run after databases are ready
      initContainers:
      - name: wait-for-postgres-words
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-words -p 5432 -U ameliavalentin; do echo waiting for postgres-words; sleep 2; done;']
      - name: wait-for-postgres-documents
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-documents -p 5432 -U ameliavalentin; do echo waiting for postgres-documents; sleep 2; done;']
      - name: wait-for-postgres-occurrences
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-occurrences -p 5432 -U ameliavalentin; do echo waiting for postgres-occurrences; sleep 2; done;']
---
# ServiceMonitor for Prometheus Operator (kube-prometheus-stack)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: searchapi-servicemonitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: searchapi
  namespaceSelector:
    matchNames:
      - searchengine
  endpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: 15s
      scrapeTimeout: 10s
---
# Grafana datasource for Prometheus (kube-prometheus-stack)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-prometheus
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      isDefault: true
      url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
      editable: true
---
# Grafana dashboard (Health, Scrape & Latency)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-searchapi
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  searchapi-dashboard.json: |
    {
      "__inputs": [],
      "__requires": [
        { "type": "grafana", "id": "grafana", "name": "Grafana", "version": "10.0.0" },
        { "type": "panel", "id": "timeseries", "name": "Time series", "version": "10.0.0" },
        { "type": "datasource", "id": "prometheus", "name": "Prometheus", "version": "1.0.0" }
      ],
      "title": "SearchAPI(sharded) - Health, Scrape & Latency",
      "uid": "searchapi-health",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 3,
      "refresh": "10s",
      "panels": [
        {
          "type": "stat",
          "title": "SearchAPI Up",
          "id": 1,
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "horizontal",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "max(up{service=\"searchapi\"})",
              "legendFormat": "up",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Scrape duration (searchapi)",
          "id": 2,
          "gridPos": { "h": 8, "w": 12, "x": 8, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "avg(scrape_duration_seconds{job=~\".*searchapi.*\"})",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Samples scraped (searchapi)",
          "id": 3,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "avg(scrape_samples_post_metric_relabeling{job=~\".*searchapi.*\"})",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Latency p50/p95/p99 (ms)",
          "id": 10,
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.50, sum by (le) (rate(search_latency_ms_milliseconds_bucket[5m])))", "legendFormat": "p50" },
            { "refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(search_latency_ms_milliseconds_bucket[5m])))", "legendFormat": "p95" },
            { "refId": "C", "expr": "histogram_quantile(0.99, sum by (le) (rate(search_latency_ms_milliseconds_bucket[5m])))", "legendFormat": "p99" }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "table",
          "title": "Top users by p95 latency (last 15m)",
          "id": 11,
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 23 },
          "options": { "showHeader": true },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, histogram_quantile(0.95, sum by (user_id, le) (rate(search_latency_ms_milliseconds_bucket[5m]))))",
              "legendFormat": "{{user_id}}"
            }
          ],
          "transformations": [ { "id": "labelsToFields", "options": { "mode": "columns" } } ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Requests per second",
          "id": 12,
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 23 },
          "fieldConfig": { "defaults": { "unit": "req/s" } },
          "targets": [
            { "refId": "A", "expr": "sum(rate(search_requests_total_count_total[5m])) or vector(0)", "legendFormat": "rps" }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "timeseries",
          "title": "Error rate",
          "id": 13,
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 33 },
          "fieldConfig": { "defaults": { "unit": "req/s" } },
          "targets": [
            { "refId": "A", "expr": "sum(rate(search_errors_total_count_total[5m])) or vector(0)", "legendFormat": "errors/s" }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        },
        {
          "type": "table",
          "title": "Recent searches (~last 100)",
          "id": 14,
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 41 },
          "options": { "showHeader": true },
          "targets": [
            {
              "refId": "A",
              "expr": "{__name__=~\"search_recent_ms_.*_milliseconds\"}",
              "legendFormat": "{{__name__}}"
            }
          ],
          "transformations": [
            { "id": "reduce", "options": { "reducers": ["lastNotNull"], "includeTimeField": false } },
            { "id": "labelsToFields", "options": { "mode": "columns" } }
          ],
          "datasource": { "type": "prometheus", "uid": "Prometheus" }
        }
      ]
    }