# SearchEngine deployment with Sharded PostgreSQL for Minikube
---
apiVersion: v1
kind: Namespace
metadata:
  name: searchengine
---
# ConfigMap for database initialization scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: searchengine
data:
  init-words.sql: |
    CREATE DATABASE search_words;
    \c search_words;
    CREATE TABLE word(id INTEGER PRIMARY KEY, name TEXT UNIQUE);
    CREATE INDEX word_name_index ON word (name);
    
  init-documents.sql: |
    CREATE DATABASE search_documents;
    \c search_documents;
    CREATE TABLE document(id INTEGER PRIMARY KEY, url TEXT, idxTime TEXT, creationTime TEXT);
    CREATE INDEX document_url_index ON document (url);
    
  init-occurrences.sql: |
    CREATE DATABASE search_occurrences;
    \c search_occurrences;
    CREATE TABLE occ(wordId INTEGER, docId INTEGER);
    CREATE INDEX word_index ON occ (wordId);
    CREATE INDEX doc_index ON occ (docId);
---
# PostgreSQL Words Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-words
  namespace: searchengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-words
  template:
    metadata:
      labels:
        app: postgres-words
        shard: words
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "search_words"
        - name: POSTGRES_USER
          value: "ameliavalentin"
        - name: POSTGRES_PASSWORD
          value: "DBkonger1234"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_words
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ameliavalentin -d search_words
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        emptyDir: {}
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          items:
          - key: init-words.sql
            path: init-words.sql
---
# PostgreSQL Words Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-words
  namespace: searchengine
spec:
  selector:
    app: postgres-words
  ports:
  - port: 5432
    targetPort: 5432
---
# PostgreSQL Documents Database Deployment
